services:
  label-local:
    build: .
    container_name: label-local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATA_DIR: /data
      CUPS_SERVER: /run/cups/cups.sock
      PRINTER_NAME: ${PRINTER_NAME:-DYMO_LabelWriter_4XL}
      PRINTER_MEDIA: ${PRINTER_MEDIA:-1744907_4_in_x_6_in}
    volumes:
      - label-data:/data
      # Mount the directory, not the socket file: cupsd deletes and recreates
      # cups.sock on every restart, which orphans a file-level bind mount.
      - /run/cups:/run/cups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  label-data:
