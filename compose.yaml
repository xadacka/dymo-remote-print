services:
  label-local:
    build: .
    container_name: label-local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATA_DIR: /data
      CUPS_SERVER: host.docker.internal:631
      PRINTER_NAME: ${PRINTER_NAME:-DYMO_LabelWriter_4XL}
    volumes:
      - label-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  label-data:

