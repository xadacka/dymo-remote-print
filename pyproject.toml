[project]
name = "label-local"
version = "0.1.0"
description = "A local document-to-label printing station for DYMO printers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.12,<1",
  "Pillow>=11,<13",
  "PyMuPDF>=1.24,<2",
  "opencv-python-headless>=4.10,<5",
  "pytesseract>=0.3.13,<1",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

